<text x="308.5" y="342.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle">目标 f(w)</text>
<text x="308.5" y="357.9" font-size="9" fill="#6E7B8B" text-anchor="middle">收益 − 风险 − 成本</text>
<rect x="409" y="330" width="165" height="46" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="14"/>
<text x="491.5" y="342.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle">可行域</text>
<text x="491.5" y="357.9" font-size="9" fill="#6E7B8B" text-anchor="middle">预算 / 杠杆 / 换手</text>
<rect x="592" y="330" width="165" height="46" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="14"/>
<text x="674.5" y="342.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle">可执行解 w*</text>
