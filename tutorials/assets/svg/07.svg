<text x="590" y="138" font-size="10" fill="#6E7B8B">预算 Σw = 1</text>
<rect x="578" y="156" width="4" height="8" fill="#E07B39" rx="1"/>
<text x="590" y="164" font-size="10" fill="#6E7B8B">上下限 0 ≤ w ≤ 1</text>
<rect x="578" y="182" width="4" height="8" fill="#E07B39" rx="1"/>
<text x="590" y="190" font-size="10" fill="#6E7B8B">杠杆 / 行业暴露</text>
<rect x="578" y="208" width="4" height="8" fill="#E07B39" rx="1"/>
<text x="590" y="216" font-size="10" fill="#6E7B8B">换手 ≤ 30%</text>
<rect x="578" y="234" width="4" height="8" fill="#E07B39" rx="1"/>
<text x="590" y="242" font-size="10" fill="#6E7B8B">整数手数（取整）</text>
<text x="578" y="292" font-size="9.5" fill="#6E7B8B">摩擦进入约束后，</text>
<text x="578" y="308" font-size="9.5" fill="#1B3A5C">理论最优 ≠ 可执行解</text>
