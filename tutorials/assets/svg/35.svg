<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="35 凯利公式与仓位管理" font-family="Microsoft YaHei, SimHei, sans-serif">
<title>35 凯利公式与仓位管理｜知识图</title>
<desc>本章主线：增长率在 f* 见顶；参数估错一点就会过押，所以实务只用分数凯利。</desc>
<rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
<defs><marker id="a35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1B3A5C"/></marker><marker id="ao35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E07B39"/></marker><marker id="ag35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E7B8B"/></marker></defs>
<rect x="40" y="19" width="46" height="29" fill="#E07B39" rx="8"/>
<text x="63" y="39" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">35</text>
<text x="98" y="41" font-size="22" fill="#1B3A5C" font-weight="bold">凯利公式与仓位管理</text>
<line x1="40" y1="57" x2="760" y2="57" stroke="#E6EFF7" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="407" x2="760" y2="407" stroke="#E6EFF7" stroke-width="1.6" stroke-linecap="round"/>
<rect x="40" y="418" width="4" height="10" fill="#E07B39" rx="1"/>
<text x="52" y="428" font-size="13" fill="#6E7B8B">本章主线：增长率在 f* 见顶；参数估错一点就会过押，所以实务只用分数凯利。</text>
<path d="M 80 300 L 515 300" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag35)"/>
<path d="M 80 300 L 80 300" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag35)"/>
<path d="M 80 300 L 80 300" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag35)"/>
<path d="M 80 300 L 80 110" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag35)"/>
<text x="84" y="120" font-size="9" fill="#6E7B8B">g(f) 增长率</text>
<text x="492" y="318" font-size="9" fill="#6E7B8B">下注比例 f</text>
<path d="M 248 300 L 248 141.1 L 256.4 141.5 L 264.8 142.7 L 273.2 144.7 L 281.6 147.5 L 290 151.1 L 298.4 155.6 L 306.8 160.8 L 315.2 166.9 L 323.6 173.8 L 332 181.5 L 340.4 190 L 348.8 199.4 L 357.2 209.5 L 365.6 220.6 L 374 232.4 L 382.4 245.1 L 390.8 258.6 L 399.2 273 L 407.6 288.3 L 416 304.4 L 416 300" fill="#E6EFF7" stroke="#E6EFF7" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 80 300 L 88.4 284.5 L 96.8 269.9 L 105.2 256 L 113.6 242.9 L 122 230.6 L 130.4 219.1 L 138.8 208.3 L 147.2 198.4 L 155.6 189.3 L 164 180.9 L 172.4 173.4 L 180.8 166.6 L 189.2 160.6 L 197.6 155.5 L 206 151.1 L 214.4 147.5 L 222.8 144.7 L 231.2 142.7 L 239.6 141.5 L 248 141.1 L 256.4 141.5 L 264.8 142.7 L 273.2 144.7 L 281.6 147.5 L 290 151.1 L 298.4 155.6 L 306.8 160.8 L 315.2 166.9 L 323.6 173.8 L 332 181.5 L 340.4 190 L 348.8 199.4 L 357.2 209.5 L 365.6 220.6 L 374 232.4 L 382.4 245.1 L 390.8 258.6 L 399.2 273 L 407.6 288.3 L 416 304.4 L 424.4 321.3 L 432.8 339.2" fill="none" stroke="#1B3A5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="248" y1="300" x2="248" y2="148" stroke="#E07B39" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
<circle cx="248" cy="143" r="4.6" fill="#E07B39"/>
<text x="248" y="132" font-size="9" fill="#E07B39" text-anchor="middle" font-weight="bold">f* = 10%</text>
<line x1="164" y1="300" x2="164" y2="190" stroke="#6E7B8B" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="164" y="320" font-size="8.4" fill="#6E7B8B" text-anchor="middle">半凯利 5%</text>
<line x1="416" y1="300" x2="416" y2="190" stroke="#6E7B8B" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="416" y="320" font-size="8.4" fill="#6E7B8B" text-anchor="middle">2f* = 20%</text>
<text x="422" y="294" font-size="8.2" fill="#6E7B8B">增长归零</text>
<text x="300" y="258" font-size="9.4" fill="#6E7B8B">g(f) = p·ln(1+bf) + q·ln(1−f)</text>
<rect x="545" y="95" width="210" height="46" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="650" y="110.5" font-size="11.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">最优 f*</text>
<text x="650" y="128.8" font-size="8.8" fill="#6E7B8B" text-anchor="middle">(pb − q) / b</text>
<rect x="545" y="151" width="210" height="46" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="650" y="166.5" font-size="11.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">半凯利</text>
<text x="650" y="184.8" font-size="8.8" fill="#6E7B8B" text-anchor="middle">回撤小一半</text>
<rect x="545" y="207" width="210" height="46" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="650" y="222.5" font-size="11.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">过押区 f &gt; f*</text>
<text x="650" y="240.8" font-size="8.8" fill="#6E7B8B" text-anchor="middle">增长下降、波动上升</text>
<rect x="545" y="263" width="210" height="46" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="650" y="278.5" font-size="11.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">参数误差</text>
<text x="650" y="296.8" font-size="8.8" fill="#6E7B8B" text-anchor="middle">μ 估高 → f 偏大</text>
<path d="M 650 141 L 650 151" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a35)"/>
<path d="M 650 197 L 650 207" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a35)"/>
<path d="M 543 286 Q 532 300 543 118" fill="none" stroke="#6E7B8B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ag35)"/>
<rect x="55" y="340" width="700" height="44" fill="#E6EFF7" rx="14"/>
<text x="405" y="359" font-size="11.2" fill="#1B3A5C" text-anchor="middle" font-weight="bold">增长最快 ≠ 能睡着：分数凯利把回撤与参数误差一起算进去</text>
<text x="405" y="376" font-size="9" fill="#6E7B8B" text-anchor="middle">全凯利 f*；半凯利 f*/2；参数估高 20% 时 f* 同向放大</text>
</svg>
