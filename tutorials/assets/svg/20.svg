<circle cx="513.7" cy="330" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="224.3" cy="321" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="420.7" cy="348" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
