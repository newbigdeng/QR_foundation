<circle cx="389.7" cy="330" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="245" cy="321" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="482.7" cy="348" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="131.3" cy="339" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="317.3" cy="330" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="358.7" cy="321" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="203.7" cy="348" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="441.3" cy="339" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="172.7" cy="330" r="3.2" fill="#E6EFF7" stroke="#6E7B8B" stroke-width="1.1"/>
<circle cx="555" cy="300" r="6" fill="#E07B39" stroke="#E07B39" stroke-width="1.4"/>
<text x="555" y="286" font-size="9" fill="#E07B39" text-anchor="middle" font-weight="bold">max 2.5</text>
<text x="58" y="294" font-size="9" fill="#1B3A5C">P(至少一个假阳性) ≈ 64%</text>
<text x="58" y="308" font-size="8.6" fill="#6E7B8B">Bonferroni 阈值 ≈ 0.05/20</text>
