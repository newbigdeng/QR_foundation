<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="29 曲面移动时，为什么对冲手数会变" font-family="Microsoft YaHei, SimHei, sans-serif">
<title>29 曲面移动时，为什么对冲手数会变｜知识图</title>
<desc>本章主线：sticky strike 还是 sticky delta，决定 Delta 里要不要加 Vega × 曲面斜率。</desc>
<rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
<defs><marker id="a27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1B3A5C"/></marker><marker id="ao27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E07B39"/></marker><marker id="ag27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E7B8B"/></marker></defs>
<rect x="40" y="19" width="46" height="29" fill="#E07B39" rx="8"/>
<text x="63" y="39" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">29</text>
<text x="98" y="41" font-size="22" fill="#1B3A5C" font-weight="bold">曲面移动时，为什么对冲手数会变</text>
<line x1="40" y1="57" x2="760" y2="57" stroke="#E6EFF7" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="407" x2="760" y2="407" stroke="#E6EFF7" stroke-width="1.6" stroke-linecap="round"/>
<rect x="40" y="418" width="4" height="10" fill="#E07B39" rx="1"/>
<text x="52" y="428" font-size="13" fill="#6E7B8B">本章主线：sticky strike 还是 sticky delta，决定 Delta 里要不要加 Vega × 曲面斜率。</text>
<path d="M 75 300 L 525 300" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag27)"/>
<path d="M 75 300 L 75 300" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag27)"/>
<path d="M 75 300 L 75 300" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag27)"/>
<path d="M 75 300 L 75 120" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag27)"/>
<text x="82" y="132" font-size="9.5" fill="#6E7B8B">σ</text>
<text x="516" y="318" font-size="9.5" fill="#6E7B8B">K / F</text>
<path d="M 120 158 L 162.5 189.5 L 205 212 L 247.5 225.5 L 290 230 L 332.5 225.5 L 375 212 L 417.5 189.5 L 460 158" fill="none" stroke="#6E7B8B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M 142 142 L 184.5 173.5 L 227 196 L 269.5 209.5 L 312 214 L 354.5 209.5 L 397 196 L 439.5 173.5 L 482 142" fill="none" stroke="#1B3A5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="214" font-size="8.8" fill="#6E7B8B">旧曲面（虚线）</text>
<text x="82" y="198" font-size="8.8" fill="#1B3A5C">新曲面（实线）</text>
<line x1="350" y1="130" x2="350" y2="300" stroke="#E07B39" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
<circle cx="350" cy="226" r="4.2" fill="#FFFFFF" stroke="#6E7B8B" stroke-width="1.5"/>
<circle cx="350" cy="210" r="4.2" fill="#E07B39" stroke="#E07B39" stroke-width="1.4"/>
<path d="M 360 226 L 360 210" fill="none" stroke="#E07B39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ao27)" marker-start="url(#ao27)"/>
<text x="364" y="246" font-size="8.8" fill="#E07B39">同一 K：Δσ = Vega × 斜率</text>
<text x="346" y="322" font-size="8.8" fill="#6E7B8B" text-anchor="middle">固定 K</text>
<rect x="545" y="100" width="210" height="52" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="650" y="118.6" font-size="12" fill="#1B3A5C" text-anchor="middle" font-weight="bold">平移</text>
<text x="650" y="137.1" font-size="9" fill="#6E7B8B" text-anchor="middle">σ 整体升降</text>
<path d="M 568 138 L 568 122" fill="none" stroke="#6E7B8B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag27)"/>
<rect x="545" y="164" width="210" height="52" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="650" y="182.6" font-size="12" fill="#1B3A5C" text-anchor="middle" font-weight="bold">倾斜</text>
<text x="650" y="201.1" font-size="9" fill="#6E7B8B" text-anchor="middle">skew 变陡 / 变平</text>
<line x1="558" y1="202" x2="578" y2="186" stroke="#6E7B8B" stroke-width="1.4" stroke-linecap="round"/>
<rect x="545" y="228" width="210" height="52" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="650" y="246.6" font-size="12" fill="#1B3A5C" text-anchor="middle" font-weight="bold">凸性</text>
<text x="650" y="265.1" font-size="9" fill="#6E7B8B" text-anchor="middle">蝶式（曲率）变化</text>
<path d="M 558 252 Q 568 266 578 252" fill="none" stroke="#6E7B8B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 650 152 L 650 164" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a27)"/>
<path d="M 650 216 L 650 228" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a27)"/>
<rect x="55" y="340" width="700" height="44" fill="#E6EFF7" rx="14"/>
<text x="405" y="359" font-size="12" fill="#1B3A5C" text-anchor="middle" font-weight="bold">全导数：Δ_total = Δ_BS + Vega × ∂σ/∂F</text>
<text x="405" y="376" font-size="9" fill="#6E7B8B" text-anchor="middle">sticky strike 时第二项为 0；sticky delta 时 σ 随 K/F 走</text>
</svg>
