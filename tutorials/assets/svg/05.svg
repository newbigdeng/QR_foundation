<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="05 微积分与偏微分：期权风险从哪里来" font-family="Microsoft YaHei, SimHei, sans-serif">
<title>05 微积分与偏微分：期权风险从哪里来｜知识图</title>
<desc>本章主线：Delta 是斜率、Gamma 是曲率、Theta 是时间损耗，泰勒展开把它们合成损益账。</desc>
<rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
<defs><marker id="a07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1B3A5C"/></marker><marker id="ao07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E07B39"/></marker><marker id="ag07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E7B8B"/></marker></defs>
<rect x="40" y="19" width="46" height="29" fill="#E07B39" rx="8"/>
<text x="63" y="39" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">05</text>
<text x="98" y="41" font-size="22" fill="#1B3A5C" font-weight="bold">微积分与偏微分：期权风险从哪里来</text>
<line x1="40" y1="57" x2="760" y2="57" stroke="#E6EFF7" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="407" x2="760" y2="407" stroke="#E6EFF7" stroke-width="1.6" stroke-linecap="round"/>
<rect x="40" y="418" width="4" height="10" fill="#E07B39" rx="1"/>
<text x="52" y="428" font-size="13" fill="#6E7B8B">本章主线：Delta 是斜率、Gamma 是曲率、Theta 是时间损耗，泰勒展开把它们合成损益账。</text>
<path d="M 65 320 L 530 320" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag07)"/>
<path d="M 65 320 L 65 320" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag07)"/>
<path d="M 65 320 L 65 320" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag07)"/>
<path d="M 65 320 L 65 105" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag07)"/>
<text x="430" y="338" font-size="9.5" fill="#6E7B8B">F：标的价格</text>
<text x="74" y="118" font-size="9.5" fill="#6E7B8B">V：期权价</text>
<path d="M 90 300 L 96.6 299.8 L 103.2 299.5 L 109.8 299.2 L 116.4 298.7 L 123 298.2 L 129.6 297.6 L 136.2 296.9 L 142.8 296.2 L 149.4 295.3 L 156 294.4 L 162.6 293.4 L 169.2 292.4 L 175.8 291.2 L 182.4 290 L 189 288.7 L 195.6 287.3 L 202.2 285.8 L 208.8 284.3 L 215.4 282.6 L 222 280.9 L 228.6 279.1 L 235.2 277.3 L 241.8 275.3 L 248.4 273.3 L 255 271.2 L 261.6 269 L 268.2 266.8 L 274.8 264.4 L 281.4 262 L 288 259.5 L 294.6 256.9 L 301.2 254.2 L 307.8 251.5 L 314.4 248.7 L 321 245.8 L 327.6 242.8 L 334.2 239.8 L 340.8 236.6 L 347.4 233.4 L 354 230.1 L 360.6 226.7 L 367.2 223.3 L 373.8 219.8 L 380.4 216.1 L 387 212.4 L 393.6 208.7 L 400.2 204.8 L 406.8 200.9 L 413.4 196.9 L 420 192.8 L 426.6 188.6 L 433.2 184.4 L 439.8 180.1 L 446.4 175.7 L 453 171.2 L 459.6 166.6 L 466.2 162 L 472.8 157.2 L 479.4 152.4 L 486 147.6" fill="none" stroke="#1B3A5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="199.6" y1="294.6" x2="389.6" y2="219.2" stroke="#E07B39" stroke-width="2" stroke-linecap="round"/>
<circle cx="294.6" cy="256.9" r="5.2" fill="#E07B39"/>
<rect x="355.4" y="193.9" width="69.1" height="14" fill="#FFFFFF"/>
<text x="390" y="202.9" font-size="10" fill="#E07B39" text-anchor="middle">切线斜率 = Δ</text>
<line x1="238.5" y1="276.3" x2="360.6" y2="226.7" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 3"/>
<path d="M 299.5 251.5 L 299.6 254.9" fill="none" stroke="#6E7B8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#ag07)"/>
<rect x="328.5" y="259.5" width="46.9" height="13.5" fill="#FFFFFF"/>
<text x="352" y="268" font-size="9.5" fill="#6E7B8B" text-anchor="middle">曲率 = Γ</text>
<line x1="302" y1="255" x2="336" y2="264" stroke="#6E7B8B" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="2 2"/>
<rect x="555" y="95" width="205" height="45" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="657.5" y="110" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">Δ = ∂V/∂F</text>
<text x="657.5" y="129" font-size="9.5" fill="#6E7B8B" text-anchor="middle">一阶：方向</text>
<rect x="555" y="148" width="205" height="45" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="657.5" y="163" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">Γ = ∂²V/∂F²</text>
<text x="657.5" y="182" font-size="9.5" fill="#6E7B8B" text-anchor="middle">二阶：曲率</text>
<rect x="555" y="201" width="205" height="45" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="657.5" y="216" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">Vega = ∂V/∂σ</text>
<text x="657.5" y="235" font-size="9.5" fill="#6E7B8B" text-anchor="middle">波动率敏感度</text>
<rect x="555" y="254" width="205" height="45" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="657.5" y="269" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">Θ = ∂V/∂t</text>
<text x="657.5" y="288" font-size="9.5" fill="#6E7B8B" text-anchor="middle">时间损耗</text>
<path d="M 657.5 140 L 657.5 148" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a07)"/>
<path d="M 657.5 193 L 657.5 201" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a07)"/>
<path d="M 657.5 246 L 657.5 254" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a07)"/>
<rect x="45" y="344" width="715" height="46" fill="#E6EFF7" rx="14"/>
<text x="402" y="363" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">ΔV ≈ Δ·ΔF + ½Γ·(ΔF)² + Vega·Δσ + Θ·Δt</text>
<text x="402" y="381" font-size="9.5" fill="#6E7B8B" text-anchor="middle">泰勒展开：把四个偏导合成一笔损益账</text>
</svg>
