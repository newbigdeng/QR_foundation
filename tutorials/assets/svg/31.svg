<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="31 状态价格与资产定价的线性代数" font-family="Microsoft YaHei, SimHei, sans-serif">
<title>31 状态价格与资产定价的线性代数｜知识图</title>
<desc>本章主线：支付矩阵 × 状态价格 = 今天价格；能复制就定价，不能复制就给区间。</desc>
<rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
<defs><marker id="a19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1B3A5C"/></marker><marker id="ao19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E07B39"/></marker><marker id="ag19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E7B8B"/></marker></defs>
<rect x="40" y="19" width="46" height="29" fill="#E07B39" rx="8"/>
<text x="63" y="39" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">31</text>
<text x="98" y="41" font-size="22" fill="#1B3A5C" font-weight="bold">状态价格与资产定价的线性代数</text>
<line x1="40" y1="57" x2="760" y2="57" stroke="#E6EFF7" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="407" x2="760" y2="407" stroke="#E6EFF7" stroke-width="1.6" stroke-linecap="round"/>
<rect x="40" y="418" width="4" height="10" fill="#E07B39" rx="1"/>
<text x="52" y="428" font-size="13" fill="#6E7B8B">本章主线：支付矩阵 × 状态价格 = 今天价格；能复制就定价，不能复制就给区间。</text>
<rect x="41" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="121" y="141.3" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">资产支付矩阵 A</text>
<text x="121" y="161.4" font-size="10.5" fill="#6E7B8B" text-anchor="middle">行=世界状态，列=资产</text>
<rect x="51" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="68" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">输入</text>
<rect x="227" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="307" y="141.3" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">解复制组合 h = A⁻¹x</text>
<text x="307" y="161.4" font-size="10.5" fill="#6E7B8B" text-anchor="middle">复制成本 pᵀh</text>
<rect x="237" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="254" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">处理</text>
<rect x="413" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="493" y="141.3" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">状态价格 / SDF</text>
<text x="493" y="161.4" font-size="10.5" fill="#6E7B8B" text-anchor="middle">无套利与风险中性</text>
<rect x="423" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="440" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">输出</text>
<rect x="599" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="679" y="141.3" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">完备性与价格区间</text>
<text x="679" y="161.4" font-size="10.5" fill="#6E7B8B" text-anchor="middle">方程数 &lt; 未知数 → 区间</text>
<rect x="609" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="626" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">检查</text>
<path d="M 201 149 L 227 149" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a19)"/>
<path d="M 387 149 L 413 149" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a19)"/>
<path d="M 573 149 L 599 149" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a19)"/>
<rect x="41" y="232" width="718" height="152" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.5" rx="14"/>
<rect x="58" y="246" width="4" height="11" fill="#E07B39" rx="1"/>
<text x="70" y="256" font-size="11.5" fill="#1B3A5C" font-weight="bold">支付矩阵与状态价格</text>
<text x="58" y="276" font-size="9.5" fill="#6E7B8B">两状态支付矩阵 → 复制 / 状态价格</text>
<rect x="90" y="292" width="100" height="24" fill="#1B3A5C" stroke="#1B3A5C" stroke-width="0.9" rx="2"/>
<text x="140" y="308" font-size="9" fill="#FFFFFF" text-anchor="middle">资产 \ 世界</text>
<rect x="190" y="292" width="100" height="24" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="0.9" rx="2"/>
<text x="240" y="308" font-size="9" fill="#1B3A5C" text-anchor="middle">上涨</text>
<rect x="290" y="292" width="100" height="24" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="0.9" rx="2"/>
<text x="340" y="308" font-size="9" fill="#1B3A5C" text-anchor="middle">下跌</text>
<rect x="90" y="316" width="100" height="24" fill="#FFFFFF" stroke="#6E7B8B" stroke-width="0.8" rx="2"/>
<text x="140" y="332" font-size="9" fill="#1B3A5C" text-anchor="middle">债券</text>
<rect x="190" y="316" width="100" height="24" fill="#FFFFFF" stroke="#6E7B8B" stroke-width="0.8" rx="2"/>
<text x="240" y="332" font-size="9" fill="#1B3A5C" text-anchor="middle">1</text>
<rect x="290" y="316" width="100" height="24" fill="#FFFFFF" stroke="#6E7B8B" stroke-width="0.8" rx="2"/>
<text x="340" y="332" font-size="9" fill="#1B3A5C" text-anchor="middle">1</text>
<rect x="90" y="340" width="100" height="24" fill="#FFFFFF" stroke="#6E7B8B" stroke-width="0.8" rx="2"/>
<text x="140" y="356" font-size="9" fill="#1B3A5C" text-anchor="middle">股票</text>
<rect x="190" y="340" width="100" height="24" fill="#FFFFFF" stroke="#6E7B8B" stroke-width="0.8" rx="2"/>
<text x="240" y="356" font-size="9" fill="#1B3A5C" text-anchor="middle">120</text>
<rect x="290" y="340" width="100" height="24" fill="#FFFFFF" stroke="#6E7B8B" stroke-width="0.8" rx="2"/>
<text x="340" y="356" font-size="9" fill="#1B3A5C" text-anchor="middle">90</text>
<text x="90" y="382" font-size="9.4" fill="#1B3A5C" font-weight="bold">p = (1, 100)</text>
<path d="M 410 322 L 480 322" fill="none" stroke="#6E7B8B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag19)"/>
<text x="486" y="316" font-size="9.6" fill="#1B3A5C" font-weight="bold">解 A h = x</text>
<text x="486" y="332" font-size="9.2" fill="#6E7B8B">h = A⁻¹x</text>
<text x="486" y="350" font-size="8.8" fill="#6E7B8B">可逆 → 唯一复制价</text>
<text x="600" y="292" font-size="9" fill="#E07B39" font-weight="bold">不可逆 → 价格区间</text>
<text x="600" y="308" font-size="8.8" fill="#6E7B8B">SDF = 状态价格 / 真实概率</text>
</svg>
