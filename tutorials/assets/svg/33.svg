<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="33 资产管理：从资产配置到风险预算" font-family="Microsoft YaHei, SimHei, sans-serif">
<title>33 资产管理：从资产配置到风险预算｜知识图</title>
<desc>本章主线：先写 IPS 定资产比例，再按风险贡献分配；再平衡是纪律，也要算成本。</desc>
<rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
<defs><marker id="a33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1B3A5C"/></marker><marker id="ao33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E07B39"/></marker><marker id="ag33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E7B8B"/></marker></defs>
<rect x="40" y="19" width="46" height="29" fill="#E07B39" rx="8"/>
<text x="63" y="39" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">33</text>
<text x="98" y="41" font-size="22" fill="#1B3A5C" font-weight="bold">资产管理：从资产配置到风险预算</text>
<line x1="40" y1="57" x2="760" y2="57" stroke="#E6EFF7" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="407" x2="760" y2="407" stroke="#E6EFF7" stroke-width="1.6" stroke-linecap="round"/>
<rect x="40" y="418" width="4" height="10" fill="#E07B39" rx="1"/>
<text x="52" y="428" font-size="13" fill="#6E7B8B">本章主线：先写 IPS 定资产比例，再按风险贡献分配；再平衡是纪律，也要算成本。</text>
<text x="70" y="120" font-size="11" fill="#1B3A5C" font-weight="bold">① 同一笔钱，两种分法</text>
<text x="70" y="142" font-size="9.5" fill="#6E7B8B">资本权重</text>
<rect x="70" y="150" width="144" height="42" fill="#1B3A5C" rx="2"/>
<text x="142" y="168" font-size="8.8" fill="#FFFFFF" text-anchor="middle">股票</text>
<text x="142" y="182" font-size="8.2" fill="#FFFFFF" text-anchor="middle">40%</text>
<rect x="214" y="150" width="126" height="42" fill="#E6EFF7" rx="2"/>
<text x="277" y="168" font-size="8.8" fill="#1B3A5C" text-anchor="middle">债券</text>
<text x="277" y="182" font-size="8.2" fill="#1B3A5C" text-anchor="middle">35%</text>
<rect x="340" y="150" width="54" height="42" fill="#E07B39" rx="2"/>
<text x="367" y="176" font-size="7.8" fill="#FFFFFF" text-anchor="middle">15%</text>
<rect x="394" y="150" width="36" height="42" fill="#6E7B8B" rx="2"/>
<text x="412" y="176" font-size="7.8" fill="#FFFFFF" text-anchor="middle">10%</text>
<text x="70" y="242" font-size="9.5" fill="#6E7B8B">风险贡献</text>
<rect x="70" y="250" width="198" height="42" fill="#1B3A5C" rx="2"/>
<text x="169" y="268" font-size="8.8" fill="#FFFFFF" text-anchor="middle">股票</text>
<text x="169" y="282" font-size="8.2" fill="#FFFFFF" text-anchor="middle">55%</text>
<rect x="268" y="250" width="64.8" height="42" fill="#E6EFF7" rx="2"/>
<text x="300.4" y="268" font-size="8.8" fill="#1B3A5C" text-anchor="middle">债券</text>
<text x="300.4" y="282" font-size="8.2" fill="#1B3A5C" text-anchor="middle">18%</text>
<rect x="332.8" y="250" width="79.2" height="42" fill="#E07B39" rx="2"/>
<text x="372.4" y="268" font-size="8.8" fill="#FFFFFF" text-anchor="middle">商品</text>
<text x="372.4" y="282" font-size="8.2" fill="#FFFFFF" text-anchor="middle">22%</text>
<rect x="412" y="250" width="18" height="42" fill="#6E7B8B" rx="2"/>
<text x="421" y="276" font-size="7.8" fill="#FFFFFF" text-anchor="middle">5%</text>
