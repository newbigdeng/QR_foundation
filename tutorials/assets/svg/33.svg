<text x="164" y="136" font-size="8.6" fill="#E07B39">等风险 25%</text>
<path d="M 250 200 L 250 242" fill="none" stroke="#6E7B8B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag33)"/>
<text x="258" y="226" font-size="8.8" fill="#6E7B8B">金额一样，风险贡献不同</text>
<rect x="70" y="306" width="9" height="9" fill="#1B3A5C" rx="2"/>
<text x="84" y="314" font-size="8.6" fill="#6E7B8B">股票</text>
<rect x="162" y="306" width="9" height="9" fill="#E6EFF7" rx="2"/>
<text x="176" y="314" font-size="8.6" fill="#6E7B8B">债券</text>
<rect x="254" y="306" width="9" height="9" fill="#E07B39" rx="2"/>
<text x="268" y="314" font-size="8.6" fill="#6E7B8B">商品</text>
<rect x="346" y="306" width="9" height="9" fill="#6E7B8B" rx="2"/>
<text x="360" y="314" font-size="8.6" fill="#6E7B8B">现金</text>
<rect x="465" y="95" width="290" height="62" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="610" y="118.8" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">资产统计</text>
<text x="610" y="137.4" font-size="9" fill="#6E7B8B" text-anchor="middle">收益 / 风险 / 相关性</text>
<rect x="465" y="177" width="290" height="62" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="610" y="200.8" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">配置方法</text>
<text x="610" y="219.4" font-size="9" fill="#6E7B8B" text-anchor="middle">60/40 · 等权 · 风险平价</text>
<rect x="465" y="259" width="290" height="62" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="610" y="282.8" font-size="12.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">再平衡与评价</text>
<text x="610" y="301.4" font-size="9" fill="#6E7B8B" text-anchor="middle">日历/阈值、Sharpe、回撤</text>
<path d="M 610 157 L 610 177" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a33)"/>
<path d="M 610 239 L 610 259" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a33)"/>
<text x="465" y="360" font-size="9" fill="#6E7B8B">再平衡：日历（每月）或阈值（±5%）</text>
<text x="465" y="378" font-size="9" fill="#6E7B8B">成本计入净收益，纪律不等于免费</text>
</svg>
