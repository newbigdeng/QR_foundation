<text x="238.4" y="320" font-size="10" fill="#6E7B8B" text-anchor="middle">Δt</text>
<text x="80" y="145" font-size="10" fill="#6E7B8B">路径连续，却几乎处处不可导</text>
<text x="80" y="162" font-size="10" fill="#6E7B8B">微小步长上，ΔW ≈ √Δt·Z</text>
<text x="475" y="122" font-size="11.5" fill="#1B3A5C" font-weight="bold">Σ(ΔW)² → T</text>
<text x="475" y="164" font-size="9.5" fill="#6E7B8B">n = 4</text>
<rect x="560" y="150" width="167.7" height="20" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="4"/>
<text x="733.7" y="164" font-size="9" fill="#6E7B8B">2.15</text>
<text x="475" y="208" font-size="9.5" fill="#6E7B8B">n = 20</text>
<rect x="560" y="194" width="107.6" height="20" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="4"/>
<text x="673.6" y="208" font-size="9" fill="#6E7B8B">1.38</text>
<text x="475" y="252" font-size="9.5" fill="#6E7B8B">n = 200</text>
<rect x="560" y="238" width="81.1" height="20" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="4"/>
<text x="647.1" y="252" font-size="9" fill="#6E7B8B">1.04</text>
<line x1="638" y1="142" x2="638" y2="300" stroke="#E07B39" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 3"/>
<text x="638" y="136" font-size="9" fill="#E07B39" text-anchor="middle">T = 1</text>
<text x="475" y="296" font-size="9.2" fill="#6E7B8B">步长越小，二次变差越接近真实时间</text>
<rect x="60" y="330" width="200" height="44" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="14"/>
<text x="160" y="342.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle">布朗路径 W_t</text>
<text x="160" y="357.9" font-size="9" fill="#6E7B8B" text-anchor="middle">连续、处处不可导</text>
<rect x="300" y="330" width="200" height="44" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="14"/>
<text x="400" y="342.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle">二次变差 Σ(ΔW)²</text>
<text x="400" y="357.9" font-size="9" fill="#6E7B8B" text-anchor="middle">步长越小越接近 T</text>
<rect x="540" y="330" width="200" height="44" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="14"/>
<text x="640" y="342.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle">伊藤修正 ½f″dt</text>
<text x="640" y="357.9" font-size="9" fill="#6E7B8B" text-anchor="middle">链式法则多出的项</text>
