<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="21 收益归因与因子的增量价值" font-family="Microsoft YaHei, SimHei, sans-serif">
<title>21 收益归因与因子的增量价值｜知识图</title>
<desc>本章主线：对基准回归取残差；扣掉 beta 和成本后剩下的，才是因子的增量价值。</desc>
<rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
<defs><marker id="a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1B3A5C"/></marker><marker id="ao30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E07B39"/></marker><marker id="ag30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E7B8B"/></marker></defs>
<rect x="40" y="19" width="46" height="29" fill="#E07B39" rx="8"/>
<text x="63" y="39" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">21</text>
<text x="98" y="41" font-size="22" fill="#1B3A5C" font-weight="bold">收益归因与因子的增量价值</text>
<line x1="40" y1="57" x2="760" y2="57" stroke="#E6EFF7" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="407" x2="760" y2="407" stroke="#E6EFF7" stroke-width="1.6" stroke-linecap="round"/>
<rect x="40" y="418" width="4" height="10" fill="#E07B39" rx="1"/>
<text x="52" y="428" font-size="13" fill="#6E7B8B">本章主线：对基准回归取残差；扣掉 beta 和成本后剩下的，才是因子的增量价值。</text>
<rect x="41" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="121" y="132.1" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">新 / 旧组合收益与成</text>
<text x="121" y="150.6" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">本</text>
<text x="121" y="170.6" font-size="10.5" fill="#6E7B8B" text-anchor="middle">基准、同日、分状态</text>
<rect x="51" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="68" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">输入</text>
<rect x="227" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="307" y="141.3" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">基准回归 + 同日配对</text>
<text x="307" y="161.4" font-size="10.5" fill="#6E7B8B" text-anchor="middle">β、α、残差</text>
<rect x="237" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="254" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">处理</text>
<rect x="413" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="493" y="141.3" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">alpha / 残差 / 增量</text>
<text x="493" y="161.4" font-size="10.5" fill="#6E7B8B" text-anchor="middle">按状态与成本分组</text>
<rect x="423" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="440" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">输出</text>
<rect x="599" y="88" width="160" height="122" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.5" rx="14"/>
<text x="679" y="141.3" font-size="13.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">归因表与显著性</text>
<text x="679" y="161.4" font-size="10.5" fill="#6E7B8B" text-anchor="middle">别把 beta 当本事</text>
<rect x="609" y="97" width="34" height="17" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.1" rx="7"/>
<text x="626" y="109.5" font-size="9.5" fill="#6E7B8B" text-anchor="middle">检查</text>
<path d="M 201 149 L 227 149" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a30)"/>
<path d="M 387 149 L 413 149" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a30)"/>
<path d="M 573 149 L 599 149" fill="none" stroke="#1B3A5C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a30)"/>
<rect x="41" y="232" width="718" height="152" fill="#FFFFFF" stroke="#E6EFF7" stroke-width="1.5" rx="14"/>
<rect x="58" y="246" width="4" height="11" fill="#E07B39" rx="1"/>
<text x="70" y="256" font-size="11.5" fill="#1B3A5C" font-weight="bold">新组合收益的拆解</text>
<text x="58" y="276" font-size="9.5" fill="#6E7B8B">新组合多赚的 1.3%，是 alpha 还是 beta？</text>
<path d="M 85 358 L 520 358" fill="none" stroke="#6E7B8B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag30)"/>
<rect x="105" y="297" width="78" height="61" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.2" rx="3"/>
<text x="144" y="371" font-size="8.8" fill="#6E7B8B" text-anchor="middle">旧组合</text>
<text x="144" y="290" font-size="9" fill="#1B3A5C" text-anchor="middle">+2.1%</text>
<rect x="260" y="300" width="84" height="58" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.2" rx="3"/>
<rect x="260" y="262" width="84" height="38" fill="#1B3A5C" rx="3"/>
<text x="302" y="371" font-size="8.8" fill="#6E7B8B" text-anchor="middle">新组合</text>
<text x="302" y="255" font-size="9" fill="#1B3A5C" text-anchor="middle">+3.4%</text>
<text x="302" y="330" font-size="8.4" fill="#1B3A5C" text-anchor="middle">beta 继承</text>
<text x="302" y="278" font-size="8.4" fill="#FFFFFF" text-anchor="middle">alpha 增量</text>
<rect x="400" y="344" width="60" height="14" fill="#E07B39" rx="3"/>
<text x="430" y="371" font-size="8.8" fill="#6E7B8B" text-anchor="middle">成本</text>
<text x="430" y="338" font-size="8.6" fill="#E07B39" text-anchor="middle">−0.5</text>
<text x="490" y="308" font-size="9.2" fill="#1B3A5C" font-weight="bold">残差 = 增量</text>
<text x="490" y="326" font-size="8.6" fill="#6E7B8B">同日配对 t 值</text>
<text x="490" y="344" font-size="8.6" fill="#6E7B8B">分状态看 alpha</text>
</svg>
