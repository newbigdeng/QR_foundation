<text x="492" y="374.2" font-size="8.2" fill="#6E7B8B" text-anchor="middle">收益有限、风险大</text>
<rect x="591" y="350" width="168" height="42" fill="#E6EFF7" stroke="#1B3A5C" stroke-width="1.3" rx="14"/>
<text x="675" y="360.6" font-size="9.6" fill="#1B3A5C" text-anchor="middle">Put–Call 平价</text>
<text x="675" y="374.2" font-size="8.2" fill="#6E7B8B" text-anchor="middle">C − P = F − K·e^{−rT}</text>
