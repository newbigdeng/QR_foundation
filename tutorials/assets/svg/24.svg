<text x="412" y="112" font-size="11" fill="#1B3A5C" font-weight="bold">② 卖方：收权利金 8</text>
<text x="412" y="270" font-size="9" fill="#6E7B8B">最大盈利 = 权利金</text>
<text x="412" y="288" font-size="9" fill="#E07B39">上涨风险无限</text>
<text x="662" y="238" font-size="9" fill="#6E7B8B">S</text>
