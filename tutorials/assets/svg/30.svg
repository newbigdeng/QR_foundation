<text x="602.5" y="246.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">③ 硬约束</text>
<text x="602.5" y="264.9" font-size="9" fill="#6E7B8B" text-anchor="middle">预算 / 保证金 / 换手</text>
