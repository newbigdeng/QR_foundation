<text x="602.5" y="310.4" font-size="11.5" fill="#1B3A5C" text-anchor="middle" font-weight="bold">④ 整数手数</text>
<text x="602.5" y="328.9" font-size="9" fill="#6E7B8B" text-anchor="middle">连续权重的落地</text>
